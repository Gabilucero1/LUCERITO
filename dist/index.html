<script>
const ENV={"STORAGE_KEY":"lucerito_v1","ADMIN_EMAIL":"","DEV_SHOW_CODE":false,"SUPABASE_URL":"","SUPABASE_ANON_KEY":"","FIREBASE_API_KEY":"","FIREBASE_AUTH_DOMAIN":"","FIREBASE_PROJECT_ID":"","FIREBASE_STORAGE_BUCKET":"","FIREBASE_MESSAGING_SENDER_ID":"","FIREBASE_APP_ID":"","FIREBASE_VAPID_KEY":""};
const REMOTE_ON=!!(ENV.SUPABASE_URL&&ENV.SUPABASE_ANON_KEY);
// CAPA DE SERVICIOS: es el único lugar que hay que reemplazar para conectar un servidor real.
// MODO ACTUAL ('local') = DEMOSTRACIÓN: cuentas y datos quedan en este navegador (localStorage).
// NO es seguridad real: cualquiera con acceso técnico al dispositivo puede leer o alterar estos datos.
const Store={
 ok:true,
 probe(){try{localStorage.setItem(KEY+'_p','1');localStorage.removeItem(KEY+'_p');this.ok=true}catch(e){this.ok=false}return this.ok},
 load(){if(REMOTE_ON)return null;try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},
 save(d){if(REMOTE_ON){Remote.schedule();return true}try{localStorage.setItem(KEY,JSON.stringify(d));this.ok=true}catch(e){this.ok=false}return this.ok},
 // Sesión recordada (solo MODO LOCAL). En modo conectado la recuerda Supabase Auth.
 session(){if(REMOTE_ON)return null;try{return JSON.parse(localStorage.getItem(KEY+'_session'))}catch(e){return null}},
 setSession(s){if(REMOTE_ON)return;try{localStorage.setItem(KEY+'_session',JSON.stringify(s))}catch(e){}},
 clearSession(){try{localStorage.removeItem(KEY+'_session')}catch(e){}}
 // TODO servidor: reemplazar por lecturas y escrituras a una base de datos (ej. Postgres / Supabase).
};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const Mailer={
 // TODO servidor: enviar el correo de verdad (Resend, SendGrid, Supabase Auth, etc.). Desde el navegador NO se puede.
 // Devuelve true solo si el correo realmente salió. Hoy no hay servicio conectado, por eso devuelve false.
 async send(to,subject,text){return false}
};
const Auth={
 // La contraseña nunca se guarda: solo un hash con sal (PBKDF2). En modo demo el hash se calcula en el navegador.
 async hash(pass,salt){
  if(!(window.crypto&&crypto.subtle))throw new Error('Este navegador no puede proteger contraseñas. Abrí la app con https.');
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256))},
 async check(u,pass){return !!(u&&u.hash&&u.salt)&&await this.hash(pass,u.salt)===u.hash},
 async setPassword(u,pass){u.salt=hex(crypto.getRandomValues(new Uint8Array(16)));u.hash=await this.hash(pass,u.salt)},
 // ----- Recuperación de contraseña (código temporal de 6 dígitos, vence a los 10 min, 5 intentos, un solo uso) -----
 async requestReset(email){const u=db.users.find(x=>x.email===email);
  if(!u)return {mailed:false,code:null,unknown:!!ENV.DEV_SHOW_CODE};
  const code=String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0'),salt=hex(crypto.getRandomValues(new Uint8Array(8)));
  db.resets=(db.resets||[]).filter(r=>r.email!==email);db.resets.push({email,salt,hash:await this.hash(code,salt),exp:Date.now()+10*60000,tries:0});save();
  const mailed=await Mailer.send(email,'Tu código de recuperación de LUCERITO','Tu código de recuperación de LUCERITO es: '+code);
  // MODO PRUEBA (solo si se compila con DEV_SHOW_CODE=true): muestra el código en pantalla porque no hay correo conectado.
  return {mailed,code:(!mailed&&ENV.DEV_SHOW_CODE)?code:null}},
 async verifyReset(email,code){const r=(db.resets||[]).find(x=>x.email===email);
  if(!r)return {ok:false,msg:'Pedí un código nuevo.'};
  if(Date.now()>r.exp){db.resets=db.resets.filter(x=>x!==r);save();return {ok:false,msg:'El código venció. Pedí uno nuevo.'}}
  if(r.tries>=5){db.resets=db.resets.filter(x=>x!==r);save();return {ok:false,msg:'Demasiados intentos. Pedí un código nuevo.'}}
  r.tries++;save();
  if(await this.hash(String(code).trim(),r.salt)!==r.hash)return {ok:false,msg:'El código no es correcto.'};
  return {ok:true}},
 async resetPassword(email,code,pass){const v=await this.verifyReset(email,code);if(!v.ok)return v;
  const u=db.users.find(x=>x.email===email);if(!u)return {ok:false,msg:'Cuenta no encontrada.'};
  await this.setPassword(u,pass);db.resets=db.resets.filter(x=>x.email!==email);save();return {ok:true}}
 // TODO servidor: reemplazar por un servicio de autenticación real (login, registro, sesiones y recuperación en servidor).
};

// Conexión REAL a Supabase: autenticación, base de datos central compartida y tiempo real.
// Solo se activa si hay SUPABASE_URL y SUPABASE_ANON_KEY (ver .env.example). Sin eso la app funciona en MODO LOCAL (demostración).
// La clave "anon" es pública por diseño: la seguridad real la dan las reglas RLS de db/schema.sql, no el navegador.
// En modo conectado la FUENTE DE VERDAD es la base de datos; el navegador solo guarda la sesión de Supabase.
// La URL base de Supabase debe ser SOLO https://<proyecto>.supabase.co. Si se pegó con /rest/v1 (la "Data API URL"), la autenticación iría a /rest/v1/auth/v1/... y daría 404.
const cleanSbUrl=u=>String(u||'').trim().replace(/\/+$/,'').replace(/\/(rest|auth|realtime|storage)\/v1$/i,'').replace(/\/+$/,'');
// Tabla que puede faltar si todavía no se ejecutó la migración: la app sigue funcionando y avisa.
const isMissingTable=e=>!!e&&(e.code==='PGRST205'||e.code==='42P01'||/schema cache|does not exist/i.test(e.message||''));
const SDK_URL='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js';
const SYNC=[{k:'prod',t:'products'},{k:'sup',t:'suppliers'},{k:'ped',t:'orders'},{k:'merc',t:'receipts'},{k:'pagos',t:'payments'},{k:'gastos',t:'expenses'},{k:'notas',t:'notes'},{k:'calc',t:'calc_entries',opt:true},{k:'alerts',t:'price_changes'},{k:'trash',t:'trash_items'},{k:'reqs',t:'permission_requests'},{k:'log',t:'audit_log',append:true}];
const TBL=Object.fromEntries(SYNC.map(s=>[s.t,s.k]));
let BOOTERR='',PHOTO='',FORCING=false;
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const mapProfile=r=>({id:r.username,uid:r.id,email:r.email,name:r.first_name,last:r.last_name,photo:r.photo||'',admin:r.role==='admin'?1:0,on:r.active?1:0,prefs:r.notif_prefs||{},lastSeen:r.last_seen||null,lastAccess:r.last_access?{d:iso(new Date(r.last_access)),h:new Date(r.last_access).toTimeString().slice(0,5)}:null});
const Remote={
 on:REMOTE_ON,ready:!REMOTE_ON,sb:null,uid:null,sid:null,revoked:false,recovering:false,SNAP:{},VER:{},missing:{},cfgSnap:'',pushing:false,dirty:false,lastSess:[],
 // ---------- arranque ----------
 async init(){
  try{
   if(!window.supabase)await loadScript(SDK_URL);
   this.sb=window.supabase.createClient(cleanSbUrl(ENV.SUPABASE_URL),String(ENV.SUPABASE_ANON_KEY).trim(),{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
   this.recovering=/type=recovery/.test(location.hash||'');
   this.sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){this.recovering=true;authView='recover';if(!me)render()}else if(ev==='SIGNED_OUT'&&me&&!this.leaving&&!FORCING)this.sessionEnded()});
   if(this.recovering)authView='recover';
   else{const {data,error}=await this.sb.auth.getSession();if(error)throw error;if(data&&data.session){const uid=data.session.user.id;for(let i=0;;i++){try{await this.enterFrom(uid);break}catch(e){if(i>=2)throw e;await new Promise(r=>setTimeout(r,1500*(i+1)))}}}}
  }catch(e){BOOTERR=e.message||String(e)}
  this.ready=true},
  // ---------- autenticación (¿quién es esta persona?) ----------
 msg(e){const m=String((e&&e.message)||e);if(/invalid login/i.test(m))return 'Correo o contraseña incorrectos.';if(/not confirmed/i.test(m))return 'Tenés que confirmar tu correo antes de ingresar. Revisá tu bandeja de entrada.';if(/already registered/i.test(m))return 'Ya existe una cuenta con ese correo.';if(/rate limit|too many/i.test(m))return 'Demasiados intentos. Esperá unos minutos y probá de nuevo.';if(/password/i.test(m)&&/(6|short|weak)/i.test(m))return 'La contraseña es demasiado corta o débil.';return m},
 async signUp({email,password,username,first,last}){
  const ok=await this.sb.rpc('username_available',{u:username});if(ok.error)return {error:this.msg(ok.error)};if(ok.data===false)return {error:'Ese nombre de usuario ya está en uso.'};
  const {data,error}=await this.sb.auth.signUp({email,password,options:{data:{username,first_name:first,last_name:last},emailRedirectTo:location.origin+location.pathname}});
  if(error)return {error:this.msg(error)};
  if(data.user&&data.user.identities&&data.user.identities.length===0)return {error:'Ya existe una cuenta con ese correo.'};
  return {session:data.session,user:data.user}},
 async signIn(email,password){const {data,error}=await this.sb.auth.signInWithPassword({email,password});if(error)return {error:this.msg(error)};return {session:data.session,user:data.user}},
 async resetEmail(email){const {error}=await this.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});return error?{error:this.msg(error)}:{ok:true}},
 async updatePassword(pw){const {error}=await this.sb.auth.updateUser({password:pw});return error?{error:this.msg(error)}:{ok:true}},
 async signOut(){this.leaving=true;try{if(this.sid)await this.sb.from('app_sessions').update({ended_at:new Date().toISOString()}).eq('id',this.sid)}catch(e){}
  clearInterval(this.hb);try{await this.unregisterPush()}catch(e){}
  try{await this.sb.auth.signOut({scope:'local'})}catch(e){}
  if(this.ch){try{this.sb.removeChannel(this.ch)}catch(e){}this.ch=null}this.sid=null;this.uid=null;this.leaving=false},
 // Entrar con una sesión de Supabase ya existente: recupera usuario + perfil. Nunca crea cuentas.
 async enterFrom(uid){if(this.entering)return !!me;this.entering=true;try{return await this._enter(uid)}finally{this.entering=false}},
 sessionEnded(){clearInterval(this.hb);me=null;sid=null;view='home';const s=$('#sh');if(s)s.remove();authMsg='Tu sesión terminó. Ingresá de nuevo con tu correo y contraseña.';this.sid=null;this.uid=null;this.clear();render()},
 async _enter(uid){
  const {data,error}=await this.sb.from('profiles').select('*').eq('id',uid);const row=data&&data[0];
  if(error)throw new Error('No se pudo leer tu perfil ('+error.message+'). ¿Se ejecutó db/schema.sql en Supabase?');
  if(!row){await this.sb.auth.signOut({scope:'local'});authMsg='Tu cuenta no tiene perfil. Avisale a la administradora.';return false}
  if(!row.active){if(PHOTO){await this.sb.from('profiles').update({photo:PHOTO}).eq('id',uid);PHOTO=''}await this.sb.auth.signOut({scope:'local'});authMsg='Tu cuenta está pendiente de aprobación o desactivada. Hablá con la administradora.';return false}
  this.uid=uid;this.revoked=false;await this.loadAll();this.subscribe();
  me=db.users.find(u=>u.uid===uid)||mapProfile(row);
  view=(typeof GO!=='undefined'&&GO&&NAV.some(n=>n[0]===GO))?GO:'home';authView='login';
  await this.startSession();
  const now=new Date().toISOString();await this.sb.from('profiles').update({last_access:now,last_seen:now}).eq('id',uid);me.lastAccess={d:iso(),h:hm()};
  if(PHOTO){me.photo=PHOTO;PHOTO='';await this.saveProfile()}
  log('Ingresó','Inicio de sesión');
  if(Push.configured()&&typeof Notification!=='undefined'&&Notification.permission==='granted')Push.enable().catch(()=>{});
  return true},
 async afterAuth(){const {data}=await this.sb.auth.getSession();const uid=data&&data.session&&data.session.user.id;if(!uid)return false;return this.enterFrom(uid)},
 // ---------- carga de datos centrales ----------
 async fetchAll(t){const out=[];for(let from=0;;from+=1000){const {data,error}=await this.sb.from(t).select('id,data,version').order('id',{ascending:true}).range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out},
 async fetchLog(){const {data,error}=await this.sb.from('audit_log').select('id,data,version').order('id',{ascending:false}).limit(500);if(error)throw error;return data},
 async loadAll(){
  for(const {k,t,opt} of SYNC){let rows;try{rows=t==='audit_log'?await this.fetchLog():await this.fetchAll(t)}catch(e){if(opt&&isMissingTable(e)){this.missing[t]=true;db[k]=db[k]||[];this.SNAP[t]={};this.VER[t]={};continue}throw e}delete this.missing[t];this.SNAP[t]={};this.VER[t]={};
   db[k]=rows.map(r=>{const rec={...r.data,id:r.id};this.SNAP[t][r.id]=stable(rec);this.VER[t][r.id]=r.version;return rec})}
  db.log.sort((a,b)=>b.id-a.id);
  const s=await this.sb.from('app_settings').select('data').eq('id',1);db.cfg=Object.assign({offerDays:10,approve:true},(s.data&&s.data[0]&&s.data[0].data)||{});this.cfgSnap=stable(db.cfg);
  const p=await this.sb.from('profiles').select('*');if(p.error)throw p.error;db.users=p.data.map(mapProfile)},
 clear(){for(const {k} of SYNC)db[k]=[];db.users=[];this.SNAP={};this.VER={}},
 // ---------- guardar cambios (diferencias) ----------
 schedule(){if(!this.on||!me||!this.sb)return;clearTimeout(this._t);this._t=setTimeout(()=>this.push(),120)},
 async flush(){clearTimeout(this._t);while(this.pushing)await new Promise(r=>setTimeout(r,5));if(this.on&&this.sb&&this.uid)await this.push()},
 async push(){if(this.pushing){this.dirty=true;return}this.pushing=true;
  try{do{this.dirty=false;for(const s of SYNC)await this.pushUpserts(s);for(const s of SYNC)await this.pushDeletes(s);await this.pushCfg()}while(this.dirty)}
  catch(e){toast('No se pudo guardar en el servidor: '+(e.message||e))}finally{this.pushing=false}},
 async pushUpserts({k,t,append}){if(this.missing[t])return;const snap=this.SNAP[t]||(this.SNAP[t]={}),ver=this.VER[t]||(this.VER[t]={});
  for(const rec of db[k].slice()){const id=rec.id,js=stable(rec);

    if(error){if(error.code==='23505'){db[k]=db[k].filter(r=>r!==rec);toast(t==='products'?'Ese código de barras ya está registrado en otro producto.':t==='suppliers'?'Ya existe un proveedor con ese nombre.':'Ese registro ya existe.');render();continue}throw error}
    snap[id]=js;ver[id]=1}
   else if(!append&&snap[id]!==js){const v=ver[id];const {data,error}=await this.sb.from(t).update({data:rec,version:v+1}).eq('id',id).eq('version',v).select('id');

 async pushCfg(){if(!me||!me.admin)return;if(stable(db.cfg)!==this.cfgSnap){const {error}=await this.sb.from('app_settings').update({data:db.cfg,updated_at:new Date().toISOString()}).eq('id',1);if(error)throw error;this.cfgSnap=stable(db.cfg)}},
 async resolveConflict({k,t},id){const {data}=await this.sb.from(t).select('id,data,version').eq('id',id);const row=data&&data[0],i=db[k].findIndex(r=>r.id===id);

  render()},
 // ---------- tiempo real ----------
 subscribe(){if(this.ch){try{this.sb.removeChannel(this.ch)}catch(e){}}
  let ch=this.sb.channel('lucerito');

  ch=ch.on('postgres_changes',{event:'*',schema:'public',table:'profiles'},p=>this.onProfile(p)).on('postgres_changes',{event:'*',schema:'public',table:'app_settings'},p=>this.onCfg(p)).on('postgres_changes',{event:'*',schema:'public',table:'app_sessions'},p=>this.onSess(p));
  this.ch=ch.subscribe()},
 isDirty(t,id){const rec=db[TBL[t]].find(r=>r.id===id);return !!rec&&stable(rec)!==this.SNAP[t][id]},
 onRow(t,p){if(!me)return;const k=TBL[t],arr=db[k];
  if(p.eventType==='DELETE'){const id=p.old.id,i=arr.findIndex(r=>r.id===id);if(i>=0&&!this.isDirty(t,id))arr.splice(i,1);delete this.SNAP[t][id];delete this.VER[t][id]}
  else{const row=p.new,rec={...row.data,id:row.id},i=arr.findIndex(r=>r.id===row.id);
   if(i>=0){if(this.isDirty(t,row.id))return;arr[i]=rec}else arr.push(rec);
   this.SNAP[t][row.id]=stable(rec);this.VER[t][row.id]=row.version}

  const n=mapProfile(p.new),i=db.users.findIndex(u=>u.uid===n.uid),cur=i>=0?db.users[i]:null;
  if(cur)for(const [col,key] of [['active','on'],['role','admin'],['photo','photo'],['notif_prefs','prefs'],['first_name','name'],['last_name','last'],['last_seen','lastSeen'],['last_access','lastAccess']])if(!(col in p.new)&&key in cur)n[key]=cur[key];
  if(n.uid===me.uid){Object.assign(me,n);if(i>=0)db.users[i]=me;else db.users.push(me);if(!me.on)forceOut()}
  else if(i>=0)db.users[i]=n;else db.users.push(n);

 onCfg(p){if(!me)return;db.cfg=Object.assign({offerDays:10,approve:true},p.new.data||{});this.cfgSnap=stable(db.cfg);this.refresh()},
 onSess(p){if(p.new&&p.new.id===this.sid&&p.new.revoked_at){this.revoked=true;forceOut()}},

 // ---------- sesiones (ligadas a la cuenta, no al dispositivo) ----------
 async startSession(){const {data,error}=await this.sb.from('app_sessions').insert({user_id:this.uid,device:deviceKind()+' · '+((String(navigator.userAgent).match(/(Edg|Chrome|Firefox|Safari)\//)||[0,'Navegador'])[1])}).select('id');

  if(!('serviceWorker' in navigator&&typeof Notification!=='undefined'))throw new Error('Este navegador no permite notificaciones push. En iPhone hay que agregar la app a la pantalla de inicio.');

  if(!window.firebase||!window.firebase.messaging){await loadScript('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-app-compat.js');await loadScript('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-messaging-compat.js')}

// Dinero argentino. money() muestra $14.000 / $14.500,50. parseAR() entiende lo que escribe la persona:
// 14000 · 14.000 · 14,000 (catorce mil) · 14.500,50 · 1500,5 · 0,125. Nunca agrega ceros delante.
const money=n=>'$'+Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:2,useGrouping:'always'});
const parseAR=s=>{s=String(s==null?'':s).replace(/[\s$]/g,'');if(!s)return NaN;
 if(s.includes(',')&&s.includes('.')){s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
 else if(s.includes(',')){s=/^[1-9]\d{0,2}(,\d{3})+$/.test(s)?s.replace(/,/g,''):s.replace(',','.')}
 else if(/^[1-9]\d{0,2}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 return /^\d+(\.\d+)?$/.test(s)?Math.round(Number(s)*100)/100:NaN};

// Lector de códigos de barras con la cámara del celular. NUNCA simula una lectura.
// Camino 1: BarcodeDetector nativo (Chrome/Edge en Android y PC). Camino 2: librería ZXing cargada desde CDN
// (Safari/iPhone, Firefox): PREPARADO pero SIN PROBAR en este entorno (no hay cámara). Siempre existe la entrada manual.
// La cámara solo funciona con https (Vercel lo da) y si el navegador/host la permite.
const norm=c=>{c=String(c||'').trim();return /^\d+$/.test(c)?c.replace(/^0+/,''):c.toUpperCase()};
const findByCode=c=>c?db.prod.find(p=>p.barcode&&norm(p.barcode)===norm(c)):null;
let EDP=0;
const SC={stream:null,timer:0,cb:null,done:true,reader:null,ctl:null};
const FORMATS=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'];
function scStop(){SC.done=true;clearTimeout(SC.timer);try{SC.ctl&&SC.ctl.stop()}catch(e){}try{SC.reader&&SC.reader.reset&&SC.reader.reset()}catch(e){}SC.ctl=null;SC.reader=null;if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}const o=$('#scs');if(o)o.remove()}
function scFinish(code){if(SC.done)return;const cb=SC.cb;scStop();code=String(code).trim().replace(/[^\w.\-]/g,'');if(cb&&code)cb(code)}
const scMsg=t=>{const e=$('#scm');if(e)e.textContent=t};
function scanBarcode(cb){scStop();SC.cb=cb;SC.done=false;
 const o=document.createElement('div');o.id='scs';o.className='sheet';o.style.zIndex=12;
 o.innerHTML=`<div><h2>📷 Escanear código de barras</h2><video id="scv" playsinline muted style="width:100%;max-height:45vh;border-radius:16px;background:#000;object-fit:cover"></video><p class="mut" id="scm">Pidiendo acceso a la cámara…</p><button class="btn s" id="scnew" style="display:none" onclick="window.open(location.href,'_blank')">Abrir la app en una pestaña nueva</button><label>O escribí el código</label><input id="scman" class="bigin" inputmode="numeric" placeholder="Ej: 7791234567890"><button class="btn" onclick="scManual()">Usar este código</button><button class="btn s" onclick="scStop()">Volver</button></div>`;
 document.body.appendChild(o);scStart()}
function scManual(){const c=$('#scman').value.trim();if(c.length<4)return scMsg('Escribí un código válido (mínimo 4 caracteres).');scFinish(c)}
async function scStart(){
 try{
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))throw new Error('Este navegador no permite usar la cámara (hace falta https).');
  SC.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  if(SC.done){scStop();return}
  const v=$('#scv');
  if('BarcodeDetector' in window){
   v.srcObject=SC.stream;await v.play();scMsg('Apuntá la cámara al código de barras.');
   const det=new BarcodeDetector({formats:FORMATS});
   const tick=async()=>{if(SC.done)return;try{const r=await det.detect(v);if(r.length)return scFinish(r[0].rawValue)}catch(e){}SC.timer=setTimeout(tick,200)};tick();
  }else{SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null;scMsg('Preparando lector…');await scZxing(v)}
 }catch(e){scMsg(scErr(e));const b=$('#scnew');if(b&&b.style&&window.top!==window.self)b.style.display='block'}
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('No se pudo cargar el lector alternativo.'));document.head.appendChild(s)})}
async function scZxing(v){
 if(!window.ZXing)await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
 const Z=window.ZXing,h=new Map();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39]);
 SC.reader=new Z.BrowserMultiFormatReader(h);
 SC.ctl=await SC.reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},v,res=>{if(res)scFinish(res.getText())});
 scMsg('Apuntá la cámara al código de barras.');
}

function scErr(e){const n=e&&e.name,fr=window.top!==window.self;
 if(n==='NotAllowedError'||n==='SecurityError')return 'No hay permiso para usar la cámara. Puede ser que no lo hayas permitido (tocá el candado o los ajustes del navegador junto a la dirección → Cámara → Permitir y volvé a tocar ESCANEAR)'+(fr?', o que la app esté abierta dentro de otra página (como Claude), que bloquea la cámara: abrila en su propia pestaña.':'.')+' Mientras tanto podés escribir el código abajo.';

 return (e&&e.message?e.message:'No se pudo usar la cámara.')+' Podés escribir el código abajo.'}

const secAlerts=it=>({stock:it.filter(p=>stockState(p)!=='ok').length,venc:it.filter(p=>p.venc&&days(p.venc)<=db.cfg.offerDays).length});
function secCard(s){const a=secAlerts(s.items);return `<button class="card t" onclick="openSec('${encodeURIComponent(s.key)}')"><div class="row"><div style="font-size:30px">📂</div><div class="grow"><div class="big">${esc(s.name)}</div><div class="mut">${s.items.length} ${s.items.length===1?'producto':'productos'}</div></div><div style="text-align:right">${a.stock?`<div class="tag" style="background:var(--y)">🔴 ${a.stock} stock</div>`:''}${a.venc?`<div class="tag" style="background:var(--y)">⏰ ${a.venc} vence</div>`:''}</div></div></button>`}
function openSec(k){psec=decodeURIComponent(k);render();scrollTo(0,0)}
function secList(){const L=sectores();
 return `<button class="btn" onclick="newSecForm()">➕ NUEVO SECTOR</button>${L.map(secCard).join('')||'<div class="empty">Todavía no hay productos. Creá un sector para empezar.</div>'}`}
function secView(){const s=sectores().find(x=>x.key===psec);if(!s){psec=null;return secList()}
 return `<button class="btn s" onclick="psec=null;render();scrollTo(0,0)">← VOLVER A LOS SECTORES</button><h2 style="margin-top:12px">📂 ${esc(s.name)} <span class="mut" style="font-size:15px">· ${s.items.length} ${s.items.length===1?'producto':'productos'}</span></h2><button class="btn" onclick="editProd(0,false,'',${JSON.stringify(s.key?s.name:'').replace(/"/g,'&quot;')})">➕ AGREGAR PRODUCTO A ESTE SECTOR</button>${s.items.slice().sort((a,b)=>a.name.localeCompare(b.name,'es')).map(p=>pcard(p)).join('')}${s.key?'<button class="btn s" onclick="renSecForm()">✏️ CAMBIAR NOMBRE DEL SECTOR</button>':''}`}
function newSecForm(){sheet(`<h2>➕ Nuevo sector</h2><label>Nombre del sector (ej: Fideos, Harina, Gaseosas)</label><input id="sn" class="bigin" placeholder="Nombre del sector"><p class="mut">El sector aparece en la lista cuando cargás su primer producto.</p><button class="btn" onclick="newSec()">SEGUIR: AGREGAR PRODUCTO</button><button class="btn s" onclick="closeSheet()">Cancelar</button>`)}
function newSec(){const n=String($('#sn').value||'').trim();if(!n)return toast('Escribí el nombre del sector');
 const ex=sectores().find(s=>s.key===secKey(n));if(ex){psec=ex.key;closeSheet();return toast('Ese sector ya existe: '+ex.name)}
 psec=secKey(n);editProd(0,false,'',n)}
function renSecForm(){const s=sectores().find(x=>x.key===psec);if(!s)return;sheet(`<h2>✏️ Cambiar nombre del sector</h2><label>Nombre nuevo</label><input id="sn" class="bigin" value="${esc(s.name)}"><p class="mut">Se cambia en los ${s.items.length} productos de este sector.</p><button class="btn" onclick="renSec()">GUARDAR</button><button class="btn s" onclick="closeSheet()">Cancelar</button>`)}
function renSec(){const n=String($('#sn').value||'').trim(),s=sectores().find(x=>x.key===psec);if(!n||!s)return toast('Escribí el nombre del sector');
 if(secKey(n)!==s.key&&sectores().some(x=>x.key===secKey(n)))return toast('Ya existe un sector con ese nombre');
 s.items.forEach(p=>{p.cat=n});log('Cambió el nombre de un sector',s.name,s.name,n);psec=secKey(n);save();closeSheet()}

// Cigarrillos: conteo diario por marca. Nadie anota ventas: una persona cuenta una vez por día y la app calcula lo vendido.
// Vendidos = stock que la app esperaba (último conteo + entradas − salidas registradas) − lo que se contó hoy.
// No hay tablas nuevas: cada marca es un producto (sector "Cigarrillos") y sus conteos se guardan dentro del producto (p.conteos).
const isCig=p=>p.cig===true||secKey(p.cat)==='cigarrillos';
const cigList=()=>db.prod.filter(isCig).sort((a,b)=>a.name.localeCompare(b.name,'es'));
const r2=n=>Math.round(n*100)/100;
let CQ={},CAP='';
function cigSes(){const m=new Map();cigList().forEach(p=>(p.conteos||[]).forEach(c=>{if(!m.has(c.sid))m.set(c.sid,{sid:c.sid,d:c.d,h:c.h,u:c.u,ap:c.ap==null?null:c.ap,rows:[]});m.get(c.sid).rows.push({p,c})}));return [...m.values()].sort((a,b)=>b.sid-a.sid)}
function cigTot(s){const vend=s.rows.reduce((t,r)=>t+r.c.vend,0),esp=r2(s.rows.reduce((t,r)=>t+r.c.vend*r.c.price,0)),dias=Math.max(0,...s.rows.map(r=>r.c.dias||0)),res=s.ap==null?null:r2(s.ap-esp);return {vend,esp,dias,res}}
const cigRes=t=>t.res==null?'':t.res===0?'<b style="color:var(--ok)">✅ Justo: la plata coincide</b>':t.res>0?'<b style="color:var(--ok)">Sobran '+money(t.res)+'</b>':'<b style="color:var(--warn)">⚠️ Faltan '+money(-t.res)+'</b>';
function cigSum(s,full){const t=cigTot(s);
 return `<div class="card"><div class="big">${fd(s.d)} · ${s.h}</div><div class="mut" style="font-size:12px">Contó: ${esc(s.u)}${t.dias>1?' · este conteo cubre '+t.dias+' días':''}</div>${full?s.rows.map(r=>`<div class="mut" style="margin-top:6px"><b>${esc(r.p.name)}</b>: vendió <b>${r.c.vend}</b> (esperaba ${r.c.esp}, contaste ${r.c.qty})${r.c.dif>0?'<br>⚠️ Contaste '+r.c.dif+' más de lo esperado: revisá si falta cargar una entrada de mercadería.':''}</div>`).join(''):''}<div style="margin-top:8px">Paquetes vendidos: <b>${t.vend}</b></div><div>Plata que debería haber: <b>${money(t.esp)}</b></div>${s.ap!=null?`<div>Plata apartada: <b>${money(s.ap)}</b></div><div style="margin-top:4px">${cigRes(t)}</div>`:'<div class="mut">No cargaste la plata apartada.</div>'}</div>`}
function cigPage(){const L=cigList(),S=cigSes();
 return `<h2>🚬 Cigarrillos</h2><p class="mut" style="font-size:12px">Para qué sirve esta sección: contá los cigarrillos una vez por día (a la mañana). La app compara con lo que debería haber, calcula cuántos se vendieron desde el último conteo y cuánta plata tendría que haber para volver a comprar. Nadie tiene que anotar cada venta.</p>
 ${L.length?`<div class="card" style="border-left:6px solid var(--p2,#e91e8c)"><div class="ba-t" style="margin-bottom:4px">📋 CONTEO DE HOY</div><div class="mut" style="font-size:12px">Escribí cuántos hay ahora de cada marca. Si una marca no la contás hoy, dejala vacía. A la mañana siguiente la app te dice cuántos se vendieron.</div>${L.map(p=>{const last=(p.conteos||[])[0];return `<div class="row" style="padding:10px 0;border-top:1px solid var(--p1)"><div class="grow"><div class="big">${esc(p.name)}</div><div class="mut" style="font-size:12px">Hay en la app: <b>${Number(p.stock)||0}</b>${last?' · último conteo: '+fd(last.d):' · todavía sin conteo'} · ${money(p.price)}</div></div><input class="bigin" style="width:92px;text-align:center" type="number" inputmode="numeric" min="0" placeholder="Hay" value="${esc(CQ[p.id]??'')}" oninput="CQ[${p.id}]=this.value" aria-label="Cuántos hay de ${esc(p.name)}"><button class="ib" style="background:var(--p1);color:var(--ink)" onclick="editProd(${p.id})" aria-label="Editar marca">✏️</button></div>`}).join('')}<label style="margin-top:12px">Plata apartada para reponer (opcional)</label><input class="bigin" inputmode="decimal" placeholder="Ej: 150.000" value="${esc(CAP)}" oninput="CAP=this.value"><button class="btn" onclick="cigSave()">GUARDAR CONTEO</button></div>`:'<div class="empty">Todavía no cargaste ninguna marca.</div>'}
 <button class="btn s" onclick="cigAddForm()">➕ AGREGAR MARCA</button>
 ${S.length?`<h2 style="font-size:18px;margin-top:18px">Último conteo</h2>${cigSum(S[0],true)}${S.length>1?`<h2 style="font-size:18px;margin-top:14px">Conteos anteriores</h2>${S.slice(1,8).map(s=>cigSum(s,false)).join('')}`:''}`:''}`}
function cigAddForm(){sheet(`<h2>➕ Agregar marca de cigarrillos</h2><label>Marca (ej: Marlboro Box)</label><input id="cn" class="bigin" placeholder="Nombre de la marca"><label>Precio de venta del paquete</label><input id="cp" class="bigin" inputmode="decimal" placeholder="Ej: 3.500"><label>¿Cuántos hay ahora? (opcional)</label><input id="ci" class="bigin" type="number" inputmode="numeric" min="0" placeholder="0"><button class="btn" onclick="cigAdd()">GUARDAR MARCA</button><button class="btn s" onclick="closeSheet()">Cancelar</button>`)}
function cigAdd(){const name=String($('#cn').value||'').trim(),price=numVal($('#cp').value),iv=String($('#ci').value||'').trim(),n=iv===''?0:Number(iv);
 if(!name)return toast('Escribí la marca');if(!(price>0))return toast('Escribí el precio de venta');if(!Number.isInteger(n)||n<0)return toast('Revisá cuántos hay ahora');
 if(cigList().some(p=>secKey(p.name)===secKey(name)))return toast('Esa marca ya está cargada');
 const p={id:nid(),hist:[],smov:[],name,barcode:'',cat:'Cigarrillos',sup:'',price,unit:'',disc:0,stock:0,min:0,venc:'',emoji:'🚬',cig:true,conteos:[]};db.prod.push(p);
 log('Agregó producto',name,null,'marca de cigarrillos · '+money(price));if(n>0)stockMove(p,n,'Stock inicial (cigarrillos)');save();closeSheet();toast('Marca agregada')}
function cigSave(){const rows=[];
 for(const p of cigList()){const v=String(CQ[p.id]??'').trim();if(v==='')continue;if(!/^\d+$/.test(v))return toast('Revisá el número de '+p.name);rows.push({p,q:Number(v)})}
 if(!rows.length)return toast('Escribí cuántos hay de al menos una marca');
 const aps=String(CAP||'').trim(),ap=aps===''?null:parseAR(aps);if(aps!==''&&isNaN(ap))return toast('Revisá la plata apartada');
 const sid=nid();let tv=0,te=0;
 rows.forEach(({p,q})=>{const esp=Number(p.stock)||0,last=(p.conteos||[])[0],vend=Math.max(0,esp-q),dias=last?Math.max(0,days(last.d)*-1):0;
  p.conteos=[{sid,d:iso(),h:hm(),u:me.name,esp,qty:q,vend,dif:q-esp,price:Number(p.price)||0,ap,dias},...(p.conteos||[])].slice(0,120);
  tv+=vend;te+=vend*(Number(p.price)||0);stockMove(p,q,'Conteo de cigarrillos')});
 log('Conteo de cigarrillos',rows.length+(rows.length===1?' marca':' marcas'),null,tv+' vendidos · debería haber '+money(r2(te))+(ap==null?'':' · apartado '+money(ap)));save();
 CQ={};CAP='';const s=cigSes().find(x=>x.sid===sid);sheet(`<h2>✅ Conteo guardado</h2>${s?cigSum(s,true):''}<button class="btn" onclick="closeSheet()">Listo</button>`)}

// Vencimientos por lote: un producto puede tener VARIAS fechas (distintos lotes). Se guardan dentro del producto (p.lots),
// por eso no hace falta cambiar la base de datos. p.venc queda siempre con la fecha MÁS PRÓXIMA: así las alertas, Inicio y los avisos siguen igual.
const lotList=p=>Array.isArray(p.lots)&&p.lots.length?p.lots:(p.venc?[{id:-1,venc:p.venc,qty:'',note:''}]:[]);
function lotOwn(p){if(!Array.isArray(p.lots)||!p.lots.length)p.lots=p.venc?[{id:nid(),venc:p.venc,qty:'',note:''}]:[];return p.lots}
const syncVenc=p=>{const l=Array.isArray(p.lots)?p.lots.filter(x=>x.venc).map(x=>x.venc).sort():[];p.venc=l.length?l[0]:''};
const lotQty=l=>l.qty!==''&&l.qty!=null?' · '+l.qty+' u.':'';
// El campo "Fecha de vencimiento" de la ficha del producto edita la fecha más próxima.
function applyVencEdit(p,oldV,newV){oldV=oldV||'';newV=newV||'';if(oldV===newV)return;
 const L=lotOwn(p),i=oldV?L.findIndex(x=>x.venc===oldV):-1;
 if(!newV){if(i>=0)L.splice(i,1)}else if(i>=0)L[i].venc=newV;else L.push({id:nid(),venc:newV,qty:'',note:'',u:me.name,d:iso()});
 syncVenc(p)}
const vencRows=()=>db.prod.flatMap(p=>lotList(p).filter(l=>l.venc).map(l=>({p,l}))).sort((a,b)=>a.l.venc<b.l.venc?-1:a.l.venc>b.l.venc?1:0);
const lotCard=(p,l)=>{const hasQ=l.qty!==''&&l.qty!=null;
 return pcard(p,`<div class="mut">Vence: ${fd(l.venc)}</div><div class="mut">${hasQ?'Lote: '+esc(l.qty)+' unidades · Stock total: '+p.stock:'Quedan: '+p.stock+' unidades'}</div>${l.note?`<div class="mut">${esc(l.note)}</div>`:''}${bd({venc:l.venc})}`,'lotOpen').replace(`onclick="lotOpen(${p.id})"`,`onclick="lotSheet(${p.id},${l.id})"`)};
function vencPage(){let r=vencRows();
 if(vt==='por')r=r.filter(x=>{const d=days(x.l.venc);return d>=0&&d<=30});
 if(vt==='venc')r=r.filter(x=>days(x.l.venc)<0);
 return `<h2>⏰ Vencimientos</h2><div class="tabs">${[['todos','Todos'],['por','Por vencer'],['venc','Vencidos']].map(t=>`<button class="${vt===t[0]?'on':''}" onclick="vt='${t[0]}';render()">${t[1]}</button>`).join('')}</div><button class="btn" onclick="addVenc()">+ Agregar vencimiento</button>${r.map(x=>lotCard(x.p,x.l)).join('')||'<div class="empty">No hay vencimientos en esta lista.</div>'}`}
let vpq='';
const vpList=()=>db.prod.filter(p=>matchP(p,vpq)).map(p=>`<button class="card t" onclick="lotSheet(${p.id},0)">${esc(p.emoji||emojiFor(p.name))} ${esc(p.name)}</button>`).join('')||'<div class="empty">No hay productos con ese nombre. Cargalo primero en Productos.</div>';
function addVenc(){vpq='';sheet(`<h2>Elegí el producto</h2><input class="bigin" id="vpq" placeholder="🔍 Buscar producto o código" oninput="vpq=this.value;$('#vpl').innerHTML=vpList()"><div id="vpl">${vpList()}</div><button class="btn s" onclick="closeSheet()">Cancelar</button>`)}
function lotSheet(pid,lid){const p=db.prod.find(x=>x.id===pid);if(!p)return;
 const l=lid?lotList(p).find(x=>x.id===lid):{venc:'',qty:'',note:''};if(!l)return;const d=l.venc?days(l.venc):null;
 sheet(`<div class="row">${pimgH(p)}<div class="big">${esc(p.name)}</div></div><h2>${lid?'Editar vencimiento':'Nuevo vencimiento'}</h2>${lid&&l.venc?`<div class="card" style="background:${vstate(l).c};color:#fff;text-align:center;font-weight:bold">${d<0?'Vencido':d===0?'¡Vence hoy!':'Faltan '+d+' días'}</div>`:''}<label>Fecha de vencimiento</label><input id="lv_d" type="date" value="${esc(l.venc)}"><label>Cantidad de este lote (opcional)</label><input id="lv_q" type="number" inputmode="decimal" value="${esc(l.qty)}"><label>Nota o lote (opcional)</label><input id="lv_n" value="${esc(l.note||'')}"><button class="btn" onclick="saveLot(${pid},${lid},false)">GUARDAR</button>${lid?'':`<button class="btn s" onclick="saveLot(${pid},0,true)">GUARDAR Y AGREGAR OTRO</button>`}${lid&&p.venc?`<button class="btn s" onclick="openAlert(${pid})">🏷️ Oferta y seguimiento</button>`:''}${lid&&can('del')?`<button class="btn d" onclick="delLot(${pid},${lid})">🗑️ ELIMINAR VENCIMIENTO</button>`:''}${lid&&!can('del')?'<button class="btn s" onclick="reqSheet(\'del\')">🔒 SOLICITAR PERMISO para eliminar</button>':''}<button class="btn s" onclick="closeSheet()">Cancelar</button>`)}
function saveLot(pid,lid,more){const p=db.prod.find(x=>x.id===pid);if(!p)return;
 const v=$('#lv_d').value.trim(),qS=String($('#lv_q').value).trim(),n=$('#lv_n').value.trim();
 if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return toast('Elegí la fecha de vencimiento');
 if(qS!==''&&!(Number(qS)>=0))return toast('La cantidad no es válida');
 const q=qS===''?'':Number(qS),L=lotOwn(p);
 if(lid){const l=lid===-1?L[0]:L.find(x=>x.id===lid);if(!l)return;const old=fd(l.venc)+lotQty(l);l.venc=v;l.qty=q;l.note=n;log('Modificó vencimiento',p.name,old,fd(v)+lotQty(l))}
 else{L.push({id:nid(),venc:v,qty:q,note:n,u:me.name,d:iso()});log('Agregó vencimiento',p.name,null,fd(v)+(q!==''?' · '+q+' u.':''))}
 syncVenc(p);save();
 if(more){toast('Guardado. Podés cargar otro vencimiento de '+p.name);lotSheet(pid,0)}else closeSheet()}
function delLot(pid,lid){const p=db.prod.find(x=>x.id===pid);if(!p)return;
 ask('¿Eliminar este vencimiento? Queda en el historial.',()=>{const L=lotOwn(p),i=lid===-1?0:L.findIndex(x=>x.id===lid);if(i<0)return;const l=L.splice(i,1)[0];syncVenc(p);log('Eliminó vencimiento',p.name,fd(l.venc)+lotQty(l),null);save();closeSheet()})}

// Pedidos: el estado cambia solo según la fecha de llegada (no hace falta tocar nada).
// "Agregado" (anotado, todavía no llega) → "En camino" cuando llega la fecha de llegada → "Recibido" lo marcan ellas.
// El estado automático se CALCULA al mostrar (no se guarda), así no se pisan los cambios entre usuarias.
let ptab='pend',PENDM=0;
const pedEff=x=>x.st==='Recibido'?'Recibido':x.st==='En camino'?'En camino':(x.date&&x.date<=iso()?'En camino':'Agregado');
const pedBadge=x=>{const e=pedEff(x);return e==='Recibido'?'🟢 Recibido':e==='En camino'?'🟡 En camino':(x.cd===iso()?'🔵 Agregado hoy':'🔵 Agregado')};
function pedTabs(){const n=db.ped.filter(x=>x.st!=='Recibido').length,m=db.ped.length-n;
 return `<div class="tabs">${[['pend','Pendientes ('+n+')'],['rec','Recibidos ('+m+')']].map(t=>`<button class="${ptab===t[0]?'on':''}" onclick="ptab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${ptab==='rec'?'<div class="mut" style="margin-bottom:8px">Estos pedidos ya pasaron a Mercadería recibida.</div><button class="btn s" onclick="go(\'merc\')">Ver Mercadería recibida</button>':''}`}

// Calculadora del día (en Pedidos). SUMA SOLA el importe de los pedidos que se anotaron ese día: no hay que cargar nada a mano.
// Opcional: importes sueltos (tabla calc_entries), ligados a la fecha de la jornada, que se suman al total.
const moneyC=money;
let calcDay=null;
const calcDate=()=>calcDay||iso();
const calcItems=()=>db.calc.filter(x=>x.date===calcDate()).sort((a,b)=>a.id-b.id);
const calcExtras=()=>calcItems().reduce((s,x)=>s+Math.round(x.amt*100),0)/100;
// Pedidos del día = los que se anotaron ese día (si es un pedido viejo sin fecha de alta, cuenta su fecha de llegada).
const pedDay=x=>x.cd||x.date||'';
const calcPeds=()=>db.ped.filter(x=>pedDay(x)===calcDate()).sort((a,b)=>a.id-b.id);
const calcPedTotal=()=>calcPeds().reduce((s,x)=>s+Math.round(Number(x.amt||0)*100),0)/100;
const calcTotal=()=>Math.round((calcPedTotal()+calcExtras())*100)/100;
function calcCard(){const L=calcItems(),P=calcPeds(),d=calcDate(),X=db.ped.filter(x=>x.date===d);
 const row=x=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--p1);cursor:pointer" onclick="editCol('ped',${x.id})"><div class="grow"><b>${esc(x.sup)}</b><div class="mut" style="font-size:12px">${esc(pedBadge(x))}${x.date?' · llega '+fd(x.date):''}</div></div><div class="big">${Number(x.amt)?moneyC(x.amt):'<span class="mut">sin importe</span>'}</div></div>`;
 const miss=Remote.on&&Remote.missing&&Remote.missing.calc_entries;
 return `<div class="card" id="calc"><div class="ba-t" style="margin-bottom:6px">🧮 CALCULADORA DEL DÍA</div>
 <div class="row"><div class="grow"><div class="mut">${d===iso()?'Hoy':'Otro día'} — ${fd(d)}</div></div><input type="date" style="width:auto" value="${d}" onchange="calcDay=this.value||null;render()" aria-label="Día"></div>
 <div style="text-align:center;padding:14px 0 10px"><div class="mut">TOTAL DEL DÍA</div><div class="big" style="font-size:38px" id="ctot">${moneyC(calcTotal())}</div><div class="mut">${P.length} ${P.length===1?'pedido anotado':'pedidos anotados'}${L.length?' + '+L.length+' importes sueltos':''}</div>${X.length?`<div class="mut" style="font-size:12px">Llegan este día: ${X.length} · ${moneyC(X.reduce((s,x)=>s+Math.round(Number(x.amt||0)*100),0)/100)}</div>`:''}</div>
 ${P.map(row).join('')||'<div class="mut" style="margin:8px 0;text-align:center">Todavía no hay pedidos anotados este día.</div>'}
 <div class="mut" style="margin-top:6px;font-size:12px">Se suma solo al agregar un pedido con su importe. Tocá un pedido para corregirlo.</div>
 <details style="margin-top:12px"${L.length?' open':''}><summary class="mut" style="cursor:pointer">➕ Importes sueltos (opcional)</summary>
 ${miss?'<div class="mut" style="margin:8px 0">⚠️ Para guardar importes sueltos la administradora debe ejecutar la migración db/migrations/001_calc_entries.sql en Supabase. Los pedidos se suman igual.</div>':''}
 <div class="row" style="margin-top:8px"><input id="cin" class="bigin grow" inputmode="decimal" placeholder="Importe en $ (ej: 1500 o 1.500,50)" onkeydown="if(event.key==='Enter')calcAdd()"><button class="btn" style="width:auto;margin:0;min-width:96px" onclick="calcAdd()">+ SUMAR</button></div>${L.map((x,i)=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--p1)"><div class="grow"><b>${i+1}. ${moneyC(x.amt)}</b><div class="mut" style="font-size:12px">${esc(x.h||'')} · ${esc(x.u||'')}</div></div><button class="btn s" style="width:auto;margin:0;min-height:44px" onclick="calcEdit(${x.id})" aria-label="Corregir importe">✏️</button><button class="btn s" style="width:auto;margin:0;min-height:44px" onclick="calcDel(${x.id})" aria-label="Eliminar importe">🗑️</button></div>`).join('')}${L.length?'<button class="btn d" onclick="calcClearAsk()">LIMPIAR IMPORTES SUELTOS</button>':''}</details></div>`}
function calcAdd(){const e=$('#cin');if(!e)return;const a=parseAR(e.value);if(!(a>0))return toast('Escribí un importe válido en pesos');
 db.calc.push({id:nid(),date:calcDate(),amt:a,u:me.name,h:hm()});log('Sumó un importe en la calculadora',moneyC(a),null,'Total del '+fd(calcDate())+': '+moneyC(calcTotal()));save();render();const n=$('#cin');if(n&&n.focus)n.focus()}
function calcEdit(id){const x=db.calc.find(y=>y.id===id);if(!x)return;sheet(`<h2>🧮 Corregir importe</h2><label>Importe en $</label><input id="ce" class="bigin" inputmode="decimal" value="${String(x.amt).replace('.',',')}"><button class="btn" onclick="calcSaveEdit(${id})">GUARDAR</button><button class="btn s" onclick="closeSheet()">Cancelar</button>`)}
function calcSaveEdit(id){const x=db.calc.find(y=>y.id===id),a=parseAR($('#ce').value);if(!x)return;if(!(a>0))return toast('Escribí un importe válido en pesos');
 if(a!==x.amt){log('Corrigió un importe de la calculadora',fd(x.date),moneyC(x.amt),moneyC(a));x.amt=a;save()}closeSheet()}
function calcDel(id){ask('¿Eliminar este importe? Va a la papelera y queda en el historial.',()=>{softDelete('calc',id);render()})}
function calcClearAsk(){const L=calcItems();ask('¿Limpiar los importes sueltos del '+fd(calcDate())+'? Suman '+moneyC(calcExtras())+' en '+L.length+(L.length===1?' importe':' importes')+'. Se mueven a la papelera y se pueden restaurar.',calcClear,'Sí, limpiar y empezar de nuevo')}
function calcClear(){const d=calcDate(),L=calcItems();if(!L.length)return;const tot=calcExtras();
 L.forEach(r=>{db.calc=db.calc.filter(x=>x.id!==r.id);const t={tid:0,coll:'calc',rec:r,by:me.name,uid:me.id,d:iso(),h:hm()};t.tid=t.id=nid();db.trash.unshift(t)});
 log('Reinició los importes sueltos de la calculadora',fd(d),moneyC(tot)+' en '+L.length+(L.length===1?' importe':' importes'),null);save();render()}

Store.probe();
const GO=(()=>{try{return new URLSearchParams(location.search).get('go')}catch(e){return null}})();
if(Remote.on){render();Remote.init().then(()=>render())}else{restoreLocal();render()}
if(typeof setInterval!=='undefined')setInterval(()=>{if(me&&!sessAlive())forceOut()},5000);
// Si la app vuelve al primer plano y hay una sesión de Supabase guardada que todavía no entró (por ejemplo, falló la red al abrir), se reintenta sin pedir contraseña.
if(typeof document!=='undefined'&&document.addEventListener)document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Remote.on&&Remote.ready&&!me&&!Remote.entering)Remote.afterAuth().then(ok=>{if(ok)render()}).catch(()=>{})});

</script></body></html>
